# Root-level fm_demod (fork v7.5.0). Kept out of fixtures/
# because the frozen parity goldens cover every .conf there.
multiple_demod_threads = true;
multiple_output_threads = true;
stats_filepath = "/tmp/stats.txt";
localtime = true;
tau = 0;
fm_demod = "atan2";
devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  centerfreq = 151.5;
  channels:
  (
    { freq = 151.25; modulation = "nfm"; ctcss = 136.5;
      outputs: ( { type = "udp_stream"; dest_address = "192.0.2.20"; dest_port = 5005; } ); }
  );
});
