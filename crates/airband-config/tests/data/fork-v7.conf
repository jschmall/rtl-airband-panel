# Fork v7.x settings: auto_ppm (fork v6.6.0), split_tx_drop_shorter_than
# (upstream #580, fork v6.7.0) and rtlsdr buffer_size (fork v7.2.0). Kept out of fixtures/ because the frozen
# parity goldens cover every .conf there.
multiple_demod_threads = true;
multiple_output_threads = true;
stats_filepath = "/tmp/stats.txt";
localtime = true;
split_max_file_time = 600.0;
split_tx_drop_shorter_than = 2.5;
devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  centerfreq = 120.0;
  correction = 0;          # starting value; auto_ppm adjusts from here
  auto_ppm = true;
  auto_ppm_interval = 30;
  auto_ppm_max_ppm = 100;
  auto_ppm_max_step = 5;
  channels:
  (
    {
      freq = 119.5;
      outputs: (
        { type = "file"; directory = "/tmp"; filename_template = "tower";
          split_on_transmission = true; split_tx_drop_shorter_than = 1; },
        { type = "rawfile"; directory = "/tmp"; filename_template = "tower_raw";
          split_on_transmission = true; split_tx_drop_shorter_than = 0.75; }
      );
    }
  );
},
{
  type = "rtlsdr";
  serial = "00000002";
  gain = 30;
  centerfreq = 130.0;
  correction = -12;
  auto_ppm = false;        # set up for auto_ppm, so turning it on later applies live
  buffers = 10;
  buffer_size = 320000;    # the pre-v7.2.0 fixed transfer size
  channels: ( { freq = 129.5; outputs: ( { type = "file"; directory = "/tmp"; filename_template = "ground"; } ); } );
});
