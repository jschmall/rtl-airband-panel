// Synthetic; covers setting combinations seen in real deployments that the
// fixtures don't exercise (disable on mixer/udp_stream outputs, and
// disable/send_tx_tags on a mixer's own icecast output).
multiple_demod_threads = true;
multiple_output_threads = true;
stats_filepath = "/tmp/stats.txt";
localtime = true;
devices: ({
  type = "rtlsdr"; serial = "1"; gain = 29; centerfreq = 151.78;
  channels: ({
    freq = 151.16;
    outputs: (
      { type = "mixer"; name = "all"; disable = true; },
      { type = "udp_stream"; dest_address = "127.0.0.1"; dest_port = 6001; disable = false; }
    );
  });
});
mixers: {
  all: {
    outputs: (
      { type = "icecast"; server = "ice.example.com"; port = 8000; mountpoint = "/all"; username = "source"; password = "pw"; send_tx_tags = true; disable = false; }
    );
  };
};
