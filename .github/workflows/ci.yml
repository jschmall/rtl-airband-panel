name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Required before build/test -- backend/api and frontend both depend on
      # the compiled output of backend/parser and backend/validate.
      - run: npm run build:deps

      - run: npm run build

      - run: npm test --workspace=backend/parser
      - run: npm test --workspace=backend/validate
      - run: npm test --workspace=backend/api
      - run: npm test --workspace=frontend
