name: Release

# Every vX.Y.Z tag builds both release tarballs and keeps them as workflow
# artifacts. Publishing a GitHub Release is a deliberate, manual step:
# Actions -> Release -> Run workflow, with the tag to publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.4.120)"
        required: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build release tarball
        run: scripts/build-release.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${TAG#v}"
          # Release notes: this version's CHANGELOG entry.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Install: download the tarball for your machine (amd64 = 64-bit Intel/AMD, arm64 = Raspberry Pi 3/4/5 on a 64-bit OS, and other 64-bit ARM), then:"
            echo
            echo '```'
            echo "tar xzf rtl-airband-panel-$TAG-linux-<arch>.tar.gz"
            echo "cd rtl-airband-panel-$TAG-linux-<arch> && sudo ./install.sh"
            echo '```'
          } >> notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --title "rtl-airband-panel $TAG" --notes-file notes.md "${flags[@]}"
