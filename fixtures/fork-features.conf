// Synthetic fixture (not from a real deployment) exercising config surface
// that only works against jschmall/RTLSDR-Airband, not vanilla upstream:
// rdio_scanner uploads, udp_stream bit_depth/sample_rate, mixers, and the
// stats_http_address/stats_http_port/rdio_scanner_queue_depth global keys.
// See backend/parser/test/roundtrip.test.ts's "fork-features fixture" block.
multiple_demod_threads = true;
multiple_output_threads = true;
stats_filepath = "/var/lib/rtl-airband/stats/fork-features.txt";
localtime = true;
stats_http_address = "127.0.0.1";
stats_http_port = 9091;
rdio_scanner_queue_depth = 128;
devices: (
  {
    type = "rtlsdr";
    serial = "22";
    gain = 29;
    centerfreq = 155.000;
    sample_rate = 1.4;
    correction = 0;
    channels: (
      {
        freq = 155.010;
        bandwidth = 5000;
        afc = 0;
        modulation = "nfm";
        outputs: (
          {
            type = "file";
            directory = "/mnt/audio/rtlsdr-airband/fork-features/channel_01";
            filename_template = "channel_01";
            continuous = false;
            split_on_transmission = true;
            include_freq = true;
            append = true;
            dated_subdirectories = true;
            rdio_scanner: {
              server = "rdio.example.com";
              port = 443;
              use_tls = true;
              api_key = "REDACTED";
              system_id = 1;
              system_label = "Fork Features Test System";
              talkgroup_id = 100;
              talkgroup_label = "Channel 01";
              source_id = 1;
              delete_after_upload = false;
              timeout_ms = 5000;
              max_retries = 2;
            };
          },
          {
            type = "udp_stream";
            dest_address = "192.0.2.20";
            dest_port = 5005;
            bit_depth = 16;
            sample_rate = 8000;
            continuous = true;
          }
        );
      },
      {
        freq = 155.025;
        bandwidth = 5000;
        afc = 0;
        modulation = "nfm";
        outputs: (
          {
            type = "mixer";
            name = "fork_mix";
            ampfactor = 1.0;
            balance = 0.0;
          }
        );
      }
    );
  }
);
mixers: {
  fork_mix: {
    highpass = 200;
    lowpass = 3000;
    outputs: (
      {
        type = "udp_stream";
        dest_address = "192.0.2.21";
        dest_port = 5006;
        bit_depth = 8;
        sample_rate = 8000;
      }
    );
  };
};
