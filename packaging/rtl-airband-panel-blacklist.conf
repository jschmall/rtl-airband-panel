# Installed by rtl-airband-panel's install.sh: keeps the kernel's DVB-T TV
# drivers from claiming SDR dongles, so rtl_airband can open them. Takes
# effect after a reboot (or after unloading these modules by hand).
blacklist dvb_usb_rtl28xxu
blacklist rtl2832_sdr
blacklist rtl2832
blacklist rtl2830
blacklist msi2500
blacklist msi001
