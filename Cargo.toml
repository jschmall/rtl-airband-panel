[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Moves in lockstep with every package.json version (see CLAUDE.md Conventions).
version = "0.4.106"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.85"
repository = "https://github.com/jschmall/rtl-airband-panel"

[workspace.dependencies]
async-trait = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
